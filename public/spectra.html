<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070810"><meta name="description" content="A gesture-shaped audiovisual field of spectral light.">
<title>hz / lumen</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070810;color:#f1edff}body{overscroll-behavior:none}
#field{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 47%,transparent 30%,#07081020 72%,#070810a8 130%);mix-blend-mode:multiply}
header{position:fixed;z-index:4;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 20px) 25px 0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.brand{display:flex;align-items:center;gap:11px;opacity:.78}.glyph{width:17px;height:17px;border:1px solid #e9ddff;border-radius:50%;position:relative;transform:scale(.9)}.glyph:before,.glyph:after{content:"";position:absolute;inset:3px -3px;border:1px solid #c3b4ff;border-radius:50%;transform:rotate(55deg)}.glyph:after{transform:rotate(-55deg);border-color:#9fe9e0}.wordmark{font-size:9px;letter-spacing:.34em;font-weight:500}.submark{font-size:7px;letter-spacing:.2em;color:#a5a0bb;margin-top:4px}
.tools{display:flex;gap:8px;pointer-events:auto}.tool{width:34px;height:34px;border:1px solid #ffffff20;border-radius:50%;background:#08091438;backdrop-filter:blur(12px);display:grid;place-items:center;color:#e6e0f7;opacity:.7;transition:opacity .2s,border-color .2s}.tool:hover,.tool[aria-pressed=true]{opacity:1;border-color:#d4c4ff88}.tool svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
footer{position:fixed;z-index:4;bottom:0;left:0;right:0;padding:0 25px calc(env(safe-area-inset-bottom) + 20px);display:flex;align-items:end;justify-content:space-between;pointer-events:none}.caption{font-size:8px;letter-spacing:.22em;color:#d9d3ee78;text-transform:uppercase}.state{display:flex;align-items:center;gap:8px;font-size:8px;letter-spacing:.18em;color:#d9d3ee70}.pulse{width:4px;height:4px;border-radius:50%;background:#b6f5e7;box-shadow:0 0 9px #a6ffe4}
#hint{position:fixed;z-index:3;left:50%;bottom:calc(env(safe-area-inset-bottom) + 57px);transform:translateX(-50%);white-space:nowrap;font-size:8px;letter-spacing:.17em;color:#e7e0ff62;pointer-events:none;transition:opacity 2s}
#file{display:none}
@media(max-width:600px){header{padding-left:17px;padding-right:17px}footer{padding-left:17px;padding-right:17px}.caption{max-width:58%;line-height:1.7}#hint{font-size:7px;letter-spacing:.1em}}
</style>
</head>
<body>
<canvas id="field" aria-label="Interactive abstract light field. Drag to bend the light, pinch to change its scale, and swipe to transform its form."></canvas><div class="vignette"></div>
<header><div class="brand"><span class="glyph"></span><div><div class="wordmark">H Z / L U M E N</div><div class="submark">A FIELD OF LIVING LIGHT</div></div></div>
<div class="tools">
<button class="tool" id="sound" aria-label="Toggle generative sound" aria-pressed="false" title="Generative sound"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4Z"/><path d="M17 9a5 5 0 0 1 0 6M19.5 6.5a9 9 0 0 1 0 11"/></svg></button>
<button class="tool" id="mic" aria-label="Use microphone audio" aria-pressed="false" title="Listen to your surroundings"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3m-4 0h8"/></svg></button>
<button class="tool" id="load" aria-label="Load music" title="Use a music file"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
</div></header>
<div id="hint">DRAG · PINCH · TURN · LISTEN</div>
<footer><div class="caption" id="mode">SPECTRAL MATTER / FORM 01</div><div class="state"><span class="pulse"></span><span id="status">SELF-ORGANISING</span></div></footer>
<input id="file" type="file" accept="audio/*">
<audio id="track" loop crossorigin="anonymous"></audio>
<script>
(()=>{
const canvas=document.getElementById('field'),g=canvas.getContext('2d',{alpha:false}),$=id=>document.getElementById(id);
const s={w:0,h:0,dpr:1,t:0,last:0,cx:.5,cy:.49,scale:1,turn:0,energy:.35,mode:0,palette:0,seed:1,drag:false,pts:new Map(),audio:0,level:0,bass:0,treble:0};
const palettes=[[190,214,246,278,320,35],[155,175,198,225,260,286],[320,345,12,38,270,205],[170,190,210,230,250,280],[265,290,315,180,205,225]];
const rand=(n)=>{let x=Math.sin(n*127.1+s.seed*311.7)*43758.5453;return x-Math.floor(x)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){let r=window.devicePixelRatio||1;s.dpr=Math.min(r,1.65);s.w=innerWidth;s.h=innerHeight;canvas.width=Math.round(s.w*s.dpr);canvas.height=Math.round(s.h*s.dpr);g.setTransform(s.dpr,0,0,s.dpr,0,0)}
addEventListener('resize',resize,{passive:true});resize();
const hue=(h,a=1,l=70)=>'hsla('+((h%360)+360)%360+',92%,'+l+'%,'+a+')';
function pathRibbon(points,width,color,blur,alpha=1){g.save();g.globalCompositeOperation='screen';g.beginPath();points.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.strokeStyle=color;g.lineWidth=width;g.lineCap='round';g.lineJoin='round';g.globalAlpha=alpha;g.shadowColor=color;g.shadowBlur=blur;g.stroke();g.shadowBlur=0;g.globalAlpha=alpha*.34;g.lineWidth=width*2.8;g.stroke();g.restore()}
function spectral(t){
 const w=s.w,h=s.h,cx=s.cx*w,cy=s.cy*h,unit=Math.min(w,h)*s.scale,energy=s.energy+s.level*.9,cols=palettes[s.palette],n=7;
 g.save();g.translate(cx,cy);g.rotate(s.turn);
 // spectral lens: nested non-concentric ellipses, bent by the moving field
 for(let j=0;j<n;j++){
  const phase=t*(.13+s.level*.45)+j*.42+s.seed,rx=unit*(.2+j*.105),ry=unit*(.105+j*.066);
  const pts=[];for(let i=0;i<=180;i++){const a=Math.PI*2*i/180;const warp=Math.sin(a*2+phase)*unit*(.018+s.energy*.018)+Math.sin(a*3-phase*.7)*unit*.012;const x=Math.cos(a)*(rx+warp)+Math.sin(a*2+phase)*unit*.07;const y=Math.sin(a)*(ry+warp*.8)+Math.cos(a*3-phase)*unit*.055;pts.push({x,y})}
  const c=hue(cols[j%cols.length]+s.turn*32,.45+energy*.22,64+j*2);pathRibbon(pts,1.2+j*.2,c,14+energy*25,.45+energy*.26);
 }
 // one impossible arch, spectral edge
 for(let k=0;k<3;k++){const pts=[];for(let i=0;i<=140;i++){const q=i/140,x=(q-.5)*unit*1.65;const y=-unit*.14-Math.sin(q*Math.PI)*(unit*(.32+k*.105))+Math.sin(q*9+t*.5+k)*unit*.022;pts.push({x,y})}pathRibbon(pts,2.2,hue(cols[(k+2)%cols.length]+s.turn*28,.55,73),22+energy*20,.38)}
 g.restore();
}
function aurora(t){
 const w=s.w,h=s.h,cx=s.cx*w,cy=s.cy*h,unit=Math.min(w,h)*s.scale,cols=palettes[s.palette],bands=12;
 g.save();g.globalCompositeOperation='screen';
 for(let b=0;b<bands;b++){
  const phase=t*(.12+s.level*.6)+b*.73+s.seed*.3,baseY=cy+(b-bands/2)*unit*.055;
  const pts=[];for(let i=0;i<=110;i++){const q=i/110,x=(q-.5)*w*1.25+cx;const envelope=Math.pow(Math.sin(Math.PI*q),.55);const y=baseY+Math.sin(q*5.2+phase)*unit*.15*envelope+Math.sin(q*12-phase*1.4+b)*unit*.035+Math.sin(q*2.4-phase*.4)*unit*.12;pts.push({x,y})}
  const c=hue(cols[b%cols.length]+s.turn*25,.32+s.energy*.35,65+b%4*3);pathRibbon(pts,2.5+(b%3)*1.7,c,24+s.energy*36,.23+s.energy*.2);
  if(b%2===0){const fil=[];for(let j=0;j<=30;j++){const q=j/30,x=cx+(q-.5)*w*.85+Math.sin(phase+q*8)*unit*.035;const y=baseY+Math.sin(q*4+phase)*unit*.13+Math.sin(q*11-phase)*unit*.03;fil.push({x,y:y+unit*(.04+q*.22)})}pathRibbon(fil,.7,hue(cols[(b+3)%cols.length],.3,80),10,.25)}
 }
 g.restore();
}
function hybrid(t){spectral(t);g.save();g.globalAlpha=.72;aurora(t);g.restore()}
function draw(t){
 const w=s.w,h=s.h;g.globalCompositeOperation='source-over';g.globalAlpha=1;g.fillStyle='#070810';g.fillRect(0,0,w,h);
 const cx=s.cx*w,cy=s.cy*h,glow=g.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*.8);glow.addColorStop(0,'#161528');glow.addColorStop(.48,'#0c1020');glow.addColorStop(1,'#070810');g.fillStyle=glow;g.fillRect(0,0,w,h);
 // sparse dust, spatially stable
 for(let i=0;i<90;i++){let x=rand(i+1)*w,y=rand(i+100)*h,a=(.08+rand(i+200)*.16)*(0.7+s.level);g.fillStyle='rgba(220,225,255,'+a+')';g.fillRect(x,y,rand(i+300)*1.5+.35,rand(i+400)*1.5+.35)}
 if(s.mode===0)spectral(t);else if(s.mode===1)aurora(t);else hybrid(t);
 // a small luminous singularity, not a UI control
 const r=18+s.level*45,core=g.createRadialGradient(cx,cy,0,cx,cy,r);core.addColorStop(0,'rgba(242,226,255,'+(.16+s.level*.2)+')');core.addColorStop(.25,'rgba(177,166,255,.09)');core.addColorStop(1,'transparent');g.fillStyle=core;g.fillRect(cx-r,cy-r,r*2,r*2);
}
function frame(now){if(!s.last)s.last=now;const dt=Math.min((now-s.last)/1000,.05);s.last=now;s.t+=dt*(.2+s.energy*.9);if(s.analyser){const a=new Uint8Array(s.analyser.frequencyBinCount);s.analyser.getByteFrequencyData(a);let low=0,high=0;for(let i=0;i<a.length;i++){if(i<Math.max(2,a.length*.12))low+=a[i];else if(i>a.length*.45)high+=a[i]}s.bass=low/(Math.max(1,a.length*.12)*255);s.treble=high/(Math.max(1,a.length*.55)*255);s.level+=(Math.min(1,(s.bass*.7+s.treble*.4))*.85-s.level)*.08;s.energy=clamp(s.baseEnergy+s.level*.28,.12,1.3)}draw(s.t);requestAnimationFrame(frame)}
s.baseEnergy=.35;requestAnimationFrame(frame);
function setMode(m){s.mode=(m+3)%3;$('mode').textContent=['SPECTRAL MATTER / FORM 01','POLAR FLUID / FORM 02','INTERFERENCE / FORM 03'][s.mode]}
let start=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);s.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});s.drag=true;if(s.pts.size===1)start={x:e.clientX,y:e.clientY,time:performance.now(),cx:s.cx,cy:s.cy};if(s.pts.size===2){const p=[...s.pts.values()];s.pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);s.angle=Math.atan2(p[1].y-p[0].y,p[1].x-p[0].x);s.startScale=s.scale;s.startTurn=s.turn}});
canvas.addEventListener('pointermove',e=>{if(!s.pts.has(e.pointerId))return;const prev=s.pts.get(e.pointerId);s.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(s.pts.size===1&&start){const dx=e.clientX-start.x,dy=e.clientY-start.y;s.cx=clamp(start.cx+dx/s.w,.12,.88);s.cy=clamp(start.cy+dy/s.h,.14,.86);s.baseEnergy=clamp(.35+Math.abs(dy)/s.h*1.2,.18,1.1)}else if(s.pts.size>=2){const p=[...s.pts.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),a=Math.atan2(p[1].y-p[0].y,p[1].x-p[0].x);s.scale=clamp(s.startScale*d/Math.max(1,s.pinch),.45,1.9);s.turn=s.startTurn+(a-s.angle)}});
function end(e){const p=s.pts.get(e.pointerId);s.pts.delete(e.pointerId);if(s.pts.size===0&&start){const dx=e.clientX-start.x,dy=e.clientY-start.y,dist=Math.hypot(dx,dy),elapsed=performance.now()-start.time;if(dist<18&&elapsed<300){s.seed+=1;s.palette=(s.palette+1)%palettes.length}else if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>65){setMode(s.mode+(dx<0?1:-1))}start=null}s.drag=s.pts.size>0}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
let audioCtx=null,analyser=null,source=null,osc=[],audioEl=$('track');
function connectAnalyser(node){analyser=audioCtx.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.82;node.connect(analyser);analyser.connect(audioCtx.destination);s.analyser=analyser}
async function soundscape(){audioCtx=new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();const master=audioCtx.createGain();master.gain.value=.075;const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=650;master.connect(filter);connectAnalyser(filter);[55,82.41,110,164.81].forEach((f,i)=>{const o=audioCtx.createOscillator(),gain=audioCtx.createGain(),lfo=audioCtx.createOscillator(),lg=audioCtx.createGain();o.type=i===3?'triangle':'sine';o.frequency.value=f;o.detune.value=(i-1.5)*3;gain.gain.value=[.5,.24,.12,.07][i];lfo.frequency.value=.04+i*.017;lg.gain.value=f*.012;lfo.connect(lg);lg.connect(o.frequency);o.connect(gain);gain.connect(master);o.start();lfo.start();osc.push(o,lfo)});s.audio=1;$('sound').setAttribute('aria-pressed','true');$('status').textContent='SOUND / SYNTHESIS'}
async function microphone(){if(!navigator.mediaDevices?.getUserMedia)throw Error('Microphone unavailable');const stream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();source=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.82;source.connect(analyser);s.analyser=analyser;s.audio=2;$('mic').setAttribute('aria-pressed','true');$('status').textContent='LISTENING / LIVE INPUT'}
function stopAudio(){if(audioCtx){osc.forEach(o=>{try{o.stop()}catch(_){}});osc=[];audioCtx.close();audioCtx=null}s.analyser=null;s.audio=0;s.level=0;$('sound').setAttribute('aria-pressed','false');$('mic').setAttribute('aria-pressed','false');$('status').textContent='SELF-ORGANISING'}
$('sound').addEventListener('click',async()=>{try{if(s.audio===1){stopAudio();return}stopAudio();await soundscape()}catch(e){$('status').textContent='AUDIO UNAVAILABLE'}});
$('mic').addEventListener('click',async()=>{try{if(s.audio===2){stopAudio();return}stopAudio();await microphone()}catch(e){$('status').textContent='MICROPHONE UNAVAILABLE'}});
$('load').addEventListener('click',()=>{stopAudio();$('file').click()});
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioEl.src=URL.createObjectURL(f);await audioEl.play();source=audioCtx.createMediaElementSource(audioEl);connectAnalyser(source);s.audio=3;$('status').textContent='LISTENING / '+f.name.slice(0,18).toUpperCase()}catch(_){$('status').textContent='CANNOT PLAY THIS FILE'}});
$('hint').style.opacity='1';setTimeout(()=>$('hint').style.opacity='0',6500);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&audioCtx)audioCtx.suspend();else if(audioCtx)audioCtx.resume()});
})();
</script>
</body></html>
